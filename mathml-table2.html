<script>
    function showtab(s) {
	if (s=='ltx') {hidetab('asciimath');} else {hidetab('ltx');}
	const tab=document.getElementById(s+"tab");
	tab.style.backgroundColor="white";
	tab.style.zIndex=2;
	document.getElementById(s+"b").style.display='inline';
	const estyle = document.getElementById(s+"edit").style;
	estyle.display='block';	
	estyle.zIndex=1;	
	estyle.position="relative";
    }
    function hidetab(s) {
	const tab=document.getElementById(s+"tab");
	tab.style.backgroundColor="#EEE";
	tab.style.zIndex=0;
	document.getElementById(s+"b").style.display='none';	
	const estyle = document.getElementById(s+"edit").style;
	estyle.display='none';
	estyle.zIndex=1;
	estyle.position="relative";
    }
</script>

<script>
  function updateMathML() {
      const cells = Array.from(document.querySelectorAll('td.mml'));
      const mml = document.getElementById("mmledit").value;
      for (let i =0; i < cells.length;i++) {
	  cells[i].innerHTML=mml;
      }
  }
  function updateASCIIMath() {
      document.getElementById("ltxedit").value="";
      const am = document.getElementById("asciimathedit").value;
      document.getElementById("mmledit").value=asciiToMathML(am,false,false);
      updateMathML();
  }
    let ltxdiv = document.createElement("div");
  function updateLaTeX(){
      document.getElementById("asciimathedit").value="";
      const ltxm = document.getElementById("ltxedit").value;
      temml.render(ltxm, ltxdiv, { displayMode: true });
      document.getElementById("mmledit").value=ltxdiv.innerHTML;
      updateMathML();
  }
  const mmldiv = document.createElement("div");
  function reformatMathML () {
      var mmlnew = "";
      const mmle=document.getElementById("mmledit");
      mmldiv.innerHTML=mmle.value;
      const c = mmldiv.children;
      if(c.length != 1 || c[0].localName != "math") {
          mmlnew='<math display="block">\n' + mmlIndent(c,0) + '\n</math>';
      } else {
	  mmlnew=mmlIndent(c,"\n");
      }
      mmle.value=mmlnew;
  }

  function mmlIndent(n,i) {
      var s=""
      Array.from(n).forEach(nn => {
	  if (nn.nodeType==1) {
	  s=s+ i+ "<" + nn.localName;
	  const atts=nn.attributes;
	  if(atts){
	      for(var j=0;j<atts.length;j++) {
		  const ln =atts[j].localName;
		  if(ln!="id" && ln!="class") {
		      s=s+" " + ln +'="'+atts[j].value+'"';
		  }
	      }
	  }
	      const nnc=nn.childNodes
	      if (nnc.length) {
		  s=s+">"+
		      ((nnc.length==1 && nnc[0].nodeType==3)
		       ?
		       nnc[0].wholeText.trim()
		       :
		       `${mmlIndent(nnc,i+" ")}${i}`
		      ) +
		      "</" + nn.localName + ">";
	      } else {
		  s=s+"/>";
	      }
	  } else {
	      s=s+i+nn.wholeText.trim();
	  }
      });
      return s;
  }
</script>
